[package]
name = "burda-bundle"
version = "0.1.0"
edition = "2021"
default-run = "burda-bundle"

[dependencies]
anyhow = "1"
axum = "0.8"
bytemuck = "1"
ndarray = "0.16"
safetensors = "0.6"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
